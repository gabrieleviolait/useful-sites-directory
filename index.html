  const categories = [["progetti","🚀","Miei progetti"],["download","⬇️","Download"],["utility","🧰","Utility"],["windows","🪟","Windows"],["linux","🐧","Linux"],["sviluppo","💻","Sviluppo"],["cybersecurity","🛡️","Cybersecurity"],["rete","🌐","Reti"],["virtualizzazione","🖥️","Virtualizzazione"],["ai","🤖","AI locale"],["backup","💾","Backup e dati"],["design","🎨","Design"],["opensource","📦","Open source"],["cloud","☁️","Cloud"],["formazione","📚","Formazione"],["privacy","🔒","Privacy"],["business","📈","Business"],["marketing","📣","Marketing"]];

  const normalize = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const urlOf = u => { try { const x=new URL(u,window.location.href); return ['https:','http:','file:'].includes(x.protocol)?x.href:'#'; } catch {return '#';} };
  const params = new URLSearchParams(window.location.search);
  const activeCats = new Set((params.get('cats')||'').split(',').filter(c => categoryMap.has(c)));
  const allTags = new Map();
  sitesData.forEach(s => s.tags.forEach(t => allTags.set(t,(allTags.get(t)||0)+1)));
  const activeTags = new Set((params.get('tags')||'').split(',').map(normalize).filter(t => allTags.has(t)));

  ui.input.value=filterState.q;ui.sort.value=filterState.sort;
  byId('totalCount').textContent=sitesData.length;

  const synonymGroups=[['doppioni','duplicati'],['scaricare','download'],['installare','installazione'],['macchina virtuale','vm','virtual machine'],['fotografie','immagini','foto'],['archiviazione','storage','disco'],['cifrare','crittografia','cifratura'],['rete','network','networking'],['intelligenza artificiale','ai','llm'],['rinominare','rinomina'],['codice qr','qr code','qr']];
  function expandTerm(term){

  function searchable(s){return normalize([s.nome,s.url,s.descrizione,...s.tags,...s.categorie.map(c=>categoryMap.get(c)?.name||c)].join(' '));}

  const tagCounts=[...allTags.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'it'));
  const priorities=['download','windows','linux','backup','cybersecurity','vm','llm','qr','pdf','duplicati','utility','formazione','rete','vpn','opensource','progetti','screenshot','software'];

  function categoriesMarkup(){

      categories.map(([id,ico,name])=>{const n=sitesData.filter(s=>s.categorie.includes(id)).length;return `<button type="button" class="cat-btn ${activeCats.has(id)?'active':''}" data-cat="${esc(id)}" aria-pressed="${activeCats.has(id)}">${ico} ${esc(name)} <span class="count">${n}</span></button>`}).join('');
  }

    ui.tags.innerHTML=visible.map(t=>`<button type="button" class="tag-btn ${activeTags.has(t)?'active':''}" data-tag="${esc(t)}" aria-pressed="${activeTags.has(t)}">#${esc(t)} <span aria-hidden="true">${allTags.get(t)}</span></button>`).join('')+
    `<button type="button" id="moreTagsBtn" class="more-tags">${filterState.expandTags?'Meno tag':'Tutti i tag ('+allTags.size+')'}</button>`;
  }
  function filteredSites(){
    const q=tokenize(filterState.q);
    return sitesData.filter(s=>{
      const cats=[...activeCats];
      if(cats.length && !(filterState.mode==='all'?cats.every(c=>s.categorie.includes(c)):cats.some(c=>s.categorie.includes(c))))return false;
      if([...activeTags].some(t=>!s.tags.includes(t)))return false;
      return q.every(term=>expandTerm(term).some(alias=>s._search.includes(alias)));
    }).sort((a,b)=>{
      if(filterState.sort==='az')return a.nome.localeCompare(b.nome,'it');
      if(filterState.sort==='category')return (a.categorie[0]||'').localeCompare(b.categorie[0]||'','it')||a.nome.localeCompare(b.nome,'it');

      const qa=normalize(filterState.q);
      const score=s=>(s.proprio?3:0)+(qa&&normalize(s.nome).includes(qa)?4:0);
      return score(b)-score(a)||a.nome.localeCompare(b.nome,'it');
    });
  }
  function renderGrid(){
    const list=filteredSites();
    ui.count.innerHTML=`<strong>${list.length}</strong> risorse trovate su ${sitesData.length}`;
    const parts=[];
    if(filterState.q.trim())parts.push('Ricerca: '+filterState.q.trim());

      <div class="site-tags">${s.tags.slice(0,7).map(t=>`<button type="button" class="tag-btn ${activeTags.has(t)?'active':''}" data-tag="${esc(t)}" aria-label="Filtra per tag ${esc(t)}" aria-pressed="${activeTags.has(t)}">#${esc(t)}</button>`).join('')}</div>

    </article>`).join('');
  }
  function saveFilters(){
    const u=new URL(window.location.href);
    for(const x of ['q','cats','tags','match','sort'])u.searchParams.delete(x);

    if(activeCats.size)u.searchParams.set('cats',[...activeCats].join(','));
    if(activeTags.size)u.searchParams.set('tags',[...activeTags].join(','));
    if(filterState.mode==='all')u.searchParams.set('match','all');
    if(filterState.sort!=='featured')u.searchParams.set('sort',filterState.sort);
    try{history.replaceState(null,'',u.href);}catch{  }
  }
  function update(){categoriesMarkup();tagsMarkup();renderGrid();saveFilters();}
  ui.cats.addEventListener('click',e=>{
    const b=e.target.closest('button[data-cat]');if(!b)return;

  ui.tags.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='moreTagsBtn'){filterState.expandTags=!filterState.expandTags;tagsMarkup();return;}if(b.dataset.tag)toggleTag(b.dataset.tag);});
  ui.grid.addEventListener('click',e=>{const b=e.target.closest('button[data-tag]');if(b)toggleTag(b.dataset.tag);});
  ui.input.addEventListener('input',()=>{filterState.q=ui.input.value;update();});
  byId('clearSearchBtn').addEventListener('click',()=>{filterState.q='';ui.input.value='';ui.input.focus();update();});

  update();
})();
</script>

<script>
(() => {
  'use strict';
  const directoryView = document.getElementById('directoryView');
  const adsView = document.getElementById('adsView');
  function isAdsRoute() {
    const params = new URLSearchParams(window.location.search);
    return /\/ads\/?$/i.test(window.location.pathname) || params.get('page') === 'ads' || window.location.hash.toLowerCase() === '#ads';
  }
  function syncAdsScript(showAds) {
    const existing = document.getElementById('quge-ads-script');
    if (!showAds) { if (existing) existing.remove(); return; }
    if (existing) return;
    const script = document.createElement('script');
    script.id = 'quge-ads-script';
    script.src = 'https://quge5.com/88/tag.min.js';
    script.async = true;
    script.setAttribute('data-zone', '257864');
    script.setAttribute('data-cfasync', 'false');
    document.head.appendChild(script);
  }
  async function syncAdsServiceWorker(showAds) {
    if (!('serviceWorker' in navigator)) return;
    try {
      if (showAds) {
        await navigator.serviceWorker.register('./sw.js');
      } else {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const reg of regs) {
          if (reg.active && reg.active.scriptURL.endsWith('/sw.js')) await reg.unregister();
        }
      }
    } catch (e) { console.warn('Service worker:', e); }
  }
  function renderRoute() {
    const showAds = isAdsRoute();
    directoryView.hidden = showAds;
    directoryView.style.display = showAds ? 'none' : '';
    adsView.hidden = !showAds;
    syncAdsScript(showAds);
    syncAdsServiceWorker(showAds);
  }
  window.addEventListener('popstate', renderRoute);
  window.addEventListener('hashchange', renderRoute);
  renderRoute();
